name: Turnmill QA
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package_pages:
        description: Upload the release build that passed the Pages smoke test
        type: boolean
        default: false
  schedule:
    - cron: "23 7 * * *"
# Every pushed revision runs. A newer revision may supersede only its duplicate PR preview.
concurrency:
  group: turnmill-qa-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build the instrumented application once for all checks
        env:
          VITE_CAD_QA: '1'
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: turnmill-qa-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  independent:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        group: [baseline, features]
    uses: ./.github/workflows/qa-stage.yml
    with:
      group: ${{ matrix.group }}
  fixtures:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        group: [projects, systems]
    uses: ./.github/workflows/qa-stage.yml
    with:
      group: ${{ matrix.group }}
  readers:
    needs: [build, fixtures]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/qa-stage.yml
    with:
      group: readers
      package_pages: ${{ inputs.package_pages || false }}

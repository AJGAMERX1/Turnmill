name: Publish Turnmill to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: turnmill-pages
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/qa.yml
    with:
      package_pages: true
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the tested release
        id: deployment
        uses: actions/deploy-pages@v4

name: Run a Turnmill QA group
on:
  workflow_call:
    inputs:
      group:
        required: true
        type: string
      package_pages:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: turnmill-qa-build
          path: dist
      - name: Reuse the compiled AP214 and AP242 checkers
        if: inputs.group == 'projects' || inputs.group == 'features' || inputs.group == 'readers'
        id: stepcode
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/turnmill-cad-tools/step-build/bin
            ${{ runner.temp }}/turnmill-cad-tools/step-build/lib
          key: stepcode-ubuntu-24.04-x64-5cf8fc1a-ap214e3-ap242-v1
      - name: Install CAD readers and independent STEP checker
        if: inputs.group == 'projects' || inputs.group == 'features' || inputs.group == 'readers'
        run: bash tests/qa/linux-tools.sh
      - name: Measure a solid in FreeCAD and check its STEP and STL
        if: inputs.group == 'projects' || inputs.group == 'features' || inputs.group == 'readers'
        run: |
          printf 'import Part; v=Part.makeBox(2,3,4).Volume; assert abs(v-24.0)<0.000001; print("FREECAD_ANALYTIC_OK", v)\nexit()\n' | xvfb-run -a "$FREECAD_CMD" --console | tee /tmp/freecad-tool.log
          grep -F 'FREECAD_ANALYTIC_OK' /tmp/freecad-tool.log
          "$STEPCODE_AP242" -s test-evidence/interop/block.step /tmp/qa-block.stp
          xvfb-run -a "$PRUSASLICER" --info test-evidence/interop/block.stl
          "$QA_PYTHON" -c 'import ezdxf; print(ezdxf.__version__)'
      - name: Cache the verified STEP checkers
        if: inputs.group == 'projects' && steps.stepcode.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/turnmill-cad-tools/step-build/bin
            ${{ runner.temp }}/turnmill-cad-tools/step-build/lib
          key: ${{ steps.stepcode.outputs.cache-primary-key }}
      - name: Install the systems display capture tool
        if: inputs.group == 'systems'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-pil xvfb xauth
      - name: Install production browser
        if: inputs.group != 'baseline'
        run: npx playwright-core install --with-deps chromium
      - name: Retrieve browser-built projects and drawings
        if: inputs.group == 'readers'
        uses: actions/download-artifact@v4
        with:
          name: turnmill-project-fixtures
          path: test-evidence/runner/projects-current
      - name: Retrieve solid from the systems regression
        if: inputs.group == 'readers'
        uses: actions/download-artifact@v4
        with:
          name: turnmill-systems-fixtures
          path: test-evidence/runner/interop-current
      - name: Mark the start of fresh test evidence
        run: touch "$RUNNER_TEMP/turnmill-evidence-start"
      - name: Run ${{ inputs.group }} checks
        env:
          QA_GROUP: ${{ inputs.group }}
          TURNMILL_QA_PREBUILT: '1'
          TURNMILL_X11_EVIDENCE: ${{ inputs.group != 'baseline' && '1' || '0' }}
          TURNMILL_X11_PYTHON: /usr/bin/python3
          TURNMILL_PROJECT_EVIDENCE: ${{ github.workspace }}/test-evidence/runner/projects-current
          QA_INTEROP_OUT: ${{ github.workspace }}/test-evidence/runner/interop-current
          QA_FUZZ_MS: ${{ github.event_name == 'schedule' && '3660000' || '540000' }}
          QA_SEED: ${{ github.event_name == 'schedule' && github.run_id || '539365669' }}
        run: |
          if [ "$QA_GROUP" = baseline ]; then
            npm run qa -- "$QA_GROUP"
          else
            xvfb-run -a -s "-screen 0 1920x1200x24" npm run qa -- "$QA_GROUP"
          fi
      - name: Share freshly generated project fixtures with external readers
        if: ${{ !cancelled() && inputs.group == 'projects' }}
        uses: actions/upload-artifact@v4
        with:
          name: turnmill-project-fixtures
          path: test-evidence/runner/projects-current/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Share the systems fixture with external readers
        if: ${{ !cancelled() && inputs.group == 'systems' }}
        uses: actions/upload-artifact@v4
        with:
          name: turnmill-systems-fixtures
          path: test-evidence/runner/interop-current/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Package the tested public release
        if: inputs.package_pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Collect files written by this test group
        if: always()
        run: |
          output="$RUNNER_TEMP/turnmill-qa-evidence"
          marker="$RUNNER_TEMP/turnmill-evidence-start"
          mkdir -p "$output"
          if [ -f "$marker" ]; then
            cd test-evidence
            find . -type f -cnewer "$marker" -exec cp --parents -t "$output" -- {} +
          fi
      - name: Preserve measured results and failing cases
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-qa-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.group }}
          path: ${{ runner.temp }}/turnmill-qa-evidence/
          retention-days: 7
